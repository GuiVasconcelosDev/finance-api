spring:
  application:
    name: finance-api


  datasource:
    url: jdbc:postgresql://localhost:5433/finance
    username: finance
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 60